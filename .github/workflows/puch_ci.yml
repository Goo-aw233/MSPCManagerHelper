# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python Application - MSPCManagerHelper

on:
  push:
    branches: [ "dev", "main" ]
  pull_request:
    branches: [ "dev", "main" ]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-2025-vs2026
            architecture: x64
          - os: windows-11-vs2026-arm
            architecture: ARM64
    runs-on: ${{ matrix.os }}

    env:
      ARTIFACT_PREFIX: ${{ github.ref == 'refs/heads/main' && 'MSPCManagerHelper_Beta' || 'MSPCManagerHelper_Beta_Preview' }}

    steps:
    - uses: actions/checkout@v7
    - name: Set Up Python 3.14
      uses: actions/setup-python@v7
      with:
        python-version: "3.14"
    - name: Create .venv & Install Dependencies
      run: |
        ./scripts/install_requirements_.venv.cmd
    - name: Cleanup Before First Build
      run: |
        ./scripts/build/cleanup-before-first-build.cmd

    # === Build with PyInstaller ===

    - name: Install PyInstaller
      run: |
        ./.venv/Scripts/python.exe -m pip install -r requirements-pyinstaller.txt
    - name: Build EXE with PyInstaller Onefile
      run: |
        ./scripts/build/build.cmd /python=.venv /builder=pyinstaller /type=onefile

    # === Build with Nuitka ===

    - name: Check Visual Studio Installed Workloads
      id: check_vs_workloads
      continue-on-error: true
      run: |
        ./.venv/Scripts/python.exe ./scripts/build/check_vs_workload.py
    - name: Install Nuitka and Zstandard
      if: steps.check_vs_workloads.outcome == 'success'
      run: |
        ./.venv/Scripts/python.exe -m pip install -r requirements-nuitka.txt
    - name: Build EXE with Nuitka Onefile
      if: steps.check_vs_workloads.outcome == 'success'
      run: |
        ./scripts/build/build.cmd /python=.venv /builder=nuitka /type=onefile

    - name: Upload PyInstaller Onefile Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_PREFIX }}_PyInstaller_Onefile_${{ matrix.os }}_${{ matrix.architecture }}
        path: ./dist/pyinstaller_onefile/*.exe
        if-no-files-found: error
    - name: Upload Nuitka Onefile Artifact
      if: steps.check_vs_workloads.outcome == 'success'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ARTIFACT_PREFIX }}_Nuitka_Onefile_${{ matrix.os }}_${{ matrix.architecture }}
        path: ./dist/nuitka_onefile/*.exe
        if-no-files-found: error
